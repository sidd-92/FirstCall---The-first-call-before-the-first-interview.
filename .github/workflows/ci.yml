name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  js:
    name: JS apps (dashboard, landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 (used by both apps' vitest suites) requires Node
          # ^22.22.2 || ^24.15.0 || >=26 -- its internal undici CacheStorage
          # needs a webidl util only present from there on. Node 20 crashes
          # with "webidl.util.markAsUncloneable is not a function".
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, test
        run: pnpm turbo run lint build test --filter=dashboard --filter=landing

  mcp-server:
    name: mcp-server (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-server
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  backend:
    name: backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
