[project]
name = "firstcall-backend"
version = "0.1.0"
description = "FastAPI backend for FirstCall — public job/application API and authenticated HR dashboard API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "structlog",
    "cryptography",
    "python-jose[cryptography]",
    "python-multipart",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
# B008: FastAPI's `Depends()`/`File()`-in-default-args pattern is idiomatic,
# not a bug -- see https://docs.astral.sh/ruff/rules/function-call-in-default-argument/
ignore = ["B008"]
