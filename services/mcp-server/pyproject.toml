[project]
name = "firstcall-mcp-server"
version = "0.1.0"
description = "MCP server wrapping the caspian-sdk client for FirstCall's hiring agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caspian-sdk",
    "mcp",
    "structlog",
    "cryptography",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
